<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A hidden bouquet surprise for Glaiza." />
  <title>Virtual Flowers for Jay Ann</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <link
    href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Quicksand:wght@400;500;600;700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="bouquet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bouquet-page">
  <nav class="top-nav">
    <a class="nav-link" href="gallery.html">&larr; Back to Gallery</a>
  </nav>

  <header class="reveal-header">
    <h1 class="reveal-title">Virtual Flowers for Jay Ann</h1>
    <p class="reveal-subtitle">An animated flower, again. I'm so sorry i can't give you real bouquet pa:< Bawi ako soon</p>
  </header>

  <!-- 3D Blooming Rose Scene -->
  <div class="bg-layer"></div>
  <div class="vignette"></div>
  <canvas class="bokeh-canvas" id="bokehCanvas"></canvas>

  <div class="spotlight"></div>
  <div class="spotlight-warm" id="spotlightWarm"></div>
  <div class="ambient-light" id="ambientLight"></div>
  <div class="ambient-light-2" id="ambientLight2"></div>

  <div class="scene">
      <div class="rose-wrapper" id="roseWrapper">
          <div class="stem-group">
              <div class="stem" id="stem">
                  <div class="stem-highlight"></div>
                  <div class="stem-shadow"></div>
              </div>
              <div class="thorn thorn-1"></div>
              <div class="thorn thorn-2"></div>
              <div class="thorn thorn-3"></div>
              <div class="leaf leaf-left" id="leafLeft">
                  <div class="leaf-vein"></div>
                  <div class="leaf-vein-side leaf-vein-side-1"></div>
                  <div class="leaf-vein-side leaf-vein-side-2"></div>
              </div>
              <div class="leaf leaf-right" id="leafRight">
                  <div class="leaf-vein"></div>
                  <div class="leaf-vein-side leaf-vein-side-1"></div>
                  <div class="leaf-vein-side leaf-vein-side-2"></div>
              </div>
          </div>

          <div class="calyx" id="calyx"></div>

          <div class="rose-head" id="roseHead">
              <div class="rose-glow"></div>
              <div class="rose-glow-inner"></div>
              <div class="rose-glow-hot"></div>
          </div>
      </div>
  </div>

  <div class="ground-reflection" id="groundReflection"></div>

  <div id="fallingPetals"></div>
  <div id="dustParticles"></div>
  <div id="sparkles"></div>

  <footer class="site-footer">made with <span aria-hidden="true">&#10084;</span> for my lovie</footer>

  <!-- Scripts -->
  <script src="bouquet.js"></script>
  <script src="script.js"></script>
</body>
</html>
